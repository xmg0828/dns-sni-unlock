name: Feature request
description: Propose a concrete, safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real operational problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and rollback considerations
      description: Explain firewall, access-control, compatibility, and rollback impact.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: This is intended for networks I am authorized to administer.
          required: true
        - label: This does not require a catch-all/open proxy or destructive global firewall changes.
          required: true
